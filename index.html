    <script>
        // --- DATA DE PRODUCTOS ---
        // Este objeto simulará tu base de datos de productos.
        // Aquí debes COPIAR Y ADAPTAR la información de TODOS tus productos
        // que tienes en index.html. Cada propiedad del objeto debe coincidir
        // con los IDs que le diste a tus product-box en index.html.
        const productsData = {
            "product-hoshi-ns18": {
                name: "HOSHI NS18 RAPTOR 2",
                tagline: "Camión RC de Alta Velocidad",

                    "https://raw.githubusercontent.com/jonathanunez76/verraco-toys/main/imagenes/HOSHI%20NS18%20RAPTOR%202.jpeg", // Imagen secundaria 1
                    "https://raw.githubusercontent.com/jonathanunez76/verraco-toys/main/imagenes/HOSHI%20NS18%20RAPTOR%202.1.jpeg", // Imagen secundaria 2
                    "https://raw.githubusercontent.com/jonathanunez76/verraco-toys/main/imagenes/HOSHI%20NS18%20RAPTOR%202.2.jpeg"  // Imagen secundaria 3
                ],
                videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ?si=Y0-qJq_LzM-y70J1" // Reemplaza con el video real
            },
            "product-wltoys-104020": { // EJEMPLO DE OTRO PRODUCTO, ADAPTALO A TUS DATOS
                name: "WLtoys 104020",
                tagline: "Buggy 4WD de alta velocidad",
                price: "$120.00 USD",
                description: "Un buggy de carreras potente y duradero, listo para conquistar cualquier terreno. Ideal para entusiastas del RC que buscan adrenalina.",
                features: [
                    "Escala: 1:10",
                    "Tipo: Buggy RC",
                    "Velocidad Máxima: 45 km/h",
                    "Control Remoto: 2.4GHz",
                    "Batería: 7.4V 2200mAh Li-Po",
                    "Tracción: 4WD"
                ],
                images: [
                    "https://raw.githubusercontent.com/jonathanunez76/verraco-toys/main/imagenes/wltoys-104020-principal.jpg",
                    "https://raw.githubusercontent.com/jonathanunez76/verraco-toys/main/imagenes/wltoys-104020-secundaria1.jpg",
                    "https://raw.githubusercontent.com/jonathanunez76/verraco-toys/main/imagenes/wltoys-104020-secundaria2.jpg"
                ],
                videoUrl: "" // Si no tiene video, déjalo vacío
            },
            // AÑADE AQUÍ EL RESTO DE TUS PRODUCTOS.
            // Asegúrate de que el ID (ej. "product-wltoys-104020")
            // COINCIDA EXACTAMENTE con el ID que le diste al div del producto en tu index.html.
            // Para cada producto, incluye: name, tagline, price, description, features (array), images (array), videoUrl.
            // Si un producto no tiene video, puedes dejar videoUrl: ""
        };

        // --- FUNCIONES PARA CARGAR EL DETALLE DEL PRODUCTO ---

        // Función para cambiar la imagen principal al hacer clic en una miniatura
        function changeMainImage(thumbnailSrc) {
            document.getElementById('product-detail-main-image').src = thumbnailSrc;
            
            // Actualizar clase 'active' para las miniaturas
            const thumbnails = document.querySelectorAll('.detail-thumbnail');
            thumbnails.forEach(thumb => {
                if (thumb.src === thumbnailSrc) {
                    thumb.classList.add('active');
                } else {
                    thumb.classList.remove('active');
                }
            });
        }

        // Función principal para cargar los detalles del producto
        function loadProductDetail() {
            // 1. Obtener el ID del producto de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id'); // Obtiene el valor de 'id' (ej. "product-hoshi-ns18")

            // 2. Verificar si el ID existe y si tenemos datos para ese producto
            if (!productId || !productsData[productId]) {
                // Si no se encuentra el producto, puedes redirigir a una página de error 404
                // o mostrar un mensaje de "Producto no encontrado".
                document.querySelector('.product-detail-container').innerHTML = `
                    <div style="text-align: center; width: 100%; color: #e74c3c;">
                        <h1>Producto no encontrado</h1>
                        <p>Lo sentimos, el producto que buscas no existe o no está disponible.</p>
                        <a href="index.html" style="color: #3498db; text-decoration: none;">Volver a la página principal</a>
                    </div>
                `;
                document.title = "Producto no encontrado";
                return; // Detener la función si no hay producto
            }

            const product = productsData[productId]; // Obtener todos los datos del producto

            // 3. Rellenar la información en la página
            document.title = `Detalle de Producto - ${product.name}`; // Actualizar el título de la pestaña
            document.getElementById('product-detail-name').textContent = product.name;
            document.getElementById('product-detail-tagline').textContent = product.tagline;
            document.getElementById('product-detail-info-title').textContent = product.name; // Duplicado para sección info
            document.getElementById('product-detail-price').textContent = product.price;
            document.getElementById('product-detail-description').textContent = product.description;

            // Rellenar las características
            const featuresList = document.getElementById('product-detail-features');
            featuresList.innerHTML = ''; // Limpiar cualquier característica anterior
            product.features.forEach(feature => {
                const li = document.createElement('li');
                li.textContent = feature;
                featuresList.appendChild(li);
            });

            // Rellenar las imágenes y miniaturas
            const mainImage = document.getElementById('product-detail-main-image');
            const thumbnailsContainer = document.getElementById('product-detail-thumbnails');
            thumbnailsContainer.innerHTML = ''; // Limpiar miniaturas anteriores

            if (product.images && product.images.length > 0) {
                mainImage.src = product.images[0]; // La primera imagen es la principal por defecto
                mainImage.alt = product.name;

                product.images.forEach(imgSrc => {
                    const thumbnail = document.createElement('img');
                    thumbnail.src = imgSrc;
                    thumbnail.alt = `Miniatura de ${product.name}`;
                    thumbnail.classList.add('detail-thumbnail');
                    if (imgSrc === product.images[0]) {
                        thumbnail.classList.add('active'); // Marcar la primera como activa
                    }
                    thumbnail.onclick = () => changeMainImage(imgSrc); // Asignar el evento click
                    thumbnailsContainer.appendChild(thumbnail);
                });
            } else {
                mainImage.src = "https://via.placeholder.com/500x400?text=No+Image"; // Placeholder si no hay imágenes
                mainImage.alt = "No hay imagen disponible";
            }

            // Enlace de WhatsApp
            const whatsappLink = `https://wa.me/593963057078?text=Hola!%20Quiero%20el%20${encodeURIComponent(product.name)}%20por%20${encodeURIComponent(product.price)}`;
            document.getElementById('product-detail-whatsapp-link').href = whatsappLink;

            // Video del producto
            const videoSection = document.getElementById('product-detail-video-section');
            const videoFrame = document.getElementById('product-detail-video-frame');
            if (product.videoUrl) {
                videoFrame.src = product.videoUrl;
                videoSection.style.display = 'block'; // Mostrar la sección de video
            } else {
                videoFrame.src = ''; // Limpiar el src si no hay video
                videoSection.style.display = 'none'; // Ocultar la sección de video
            }
        }

        // --- CUANDO LA PÁGINA SE CARGA ---
        document.addEventListener('DOMContentLoaded', loadProductDetail);
    </script>
