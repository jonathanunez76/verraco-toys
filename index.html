
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Mundo Juguete - Tienda Moderna</title>

    <!-- 🔒 SEGURIDAD -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://player.vimeo.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src 'self' https://player.vimeo.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="no-referrer">

    <style>
        /* 🎨 ESTILO JUGUETERÍA MODERNA Y LLAMATIVA */
        :root {
            --color-principal: #7C3AED; /* Morado Vibrante */
            --color-secundario: #5B21B6;
            --color-acento: #F59E0B; /* Naranja brillante */
            --color-fondo: #F0F4FF;
            --color-texto: #1F2937;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif;
        }
        
        body { 
            background: var(--color-fondo); 
            color: var(--color-texto);
        }
        
        /* PÁGINAS */
        .page { 
            display: none; 
            width: 100%; 
            min-height: 100vh; 
            padding: 15px; 
        }

        /* HEADER Y BOTONES */
        .detail-header { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 20px; 
            background: white;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.1);
        }
        
        .back-button { 
            padding: 10px 18px; 
            cursor: pointer; 
            font-size: 18px;
            background: var(--color-acento);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .back-button:hover {
            transform: scale(0.97);
        }

        #detail-title {
            color: var(--color-principal);
            font-size: 22px;
            font-weight: bold;
        }

        /* 🖼️ CARRUSEL DE IMÁGENES */
        #detail-slider-track {
            display: flex;
            transition: transform 0.4s ease-out;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }
        .detail-slide {
            min-width: 100%;
        }
        .detail-slide img { 
            width: 100%; 
            max-height: 550px; 
            object-fit: contain; 
            padding: 10px;
        }

        /* 🎞️ MINIATURAS */
        #detail-thumbnails-container { 
            display: flex;
            gap: 10px;
            margin-top: 15px;
            overflow-x: auto;
            padding: 5px;
        }
        #detail-thumbnails-container img { 
            width: 75px; 
            height: 75px; 
            object-fit: cover; 
            cursor: pointer; 
            border: 3px solid transparent;
            border-radius: 10px;
            background: white;
        }
        #detail-thumbnails-container img.active-thumbnail { 
            border-color: var(--color-principal); 
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.4);
        }

        /* 🎬 VIDEOS VIMEO GRANDES Y CLAROS */
        #detail-video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 25px auto;
            background: #000;
            aspect-ratio: 16 / 9;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        #detail-video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 📝 TEXTO Y PRECIOS */
        #detail-name { 
            font-size: 28px; 
            margin: 20px 0 10px; 
            font-weight: 800;
            color: var(--color-texto);
        }
        #detail-price { 
            font-size: 26px; 
            color: #10B981; /* Verde precio */
            font-weight: bold; 
        }
        #detail-description { 
            font-size: 17px; 
            line-height: 1.7; 
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid var(--color-principal);
        }

        /* 🛒 LISTADO DE PRODUCTOS */
        #products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            padding: 10px;
        }
        .product-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.2);
        }
        .details-button {
            background: var(--color-principal);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        .details-button:hover {
            background: var(--color-secundario);
        }

        /* CATEGORÍAS */
        .categories-nav button {
            padding: 12px 25px;
            margin: 5px;
            border-radius: 10px;
            border: none;
            background: #E0E7FF;
            cursor: pointer;
            font-weight: 600;
        }
        .categories-nav button.active {
            background: var(--color-principal);
            color: white;
        }
    </style>
    <!-- Fuente bonita -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- PÁGINA DE INICIO -->
    <div id="home-page" class="page" style="display:block;">
        <div style="text-align:center; padding: 50px 20px;">
            <h1 style="font-size: 60px; color: var(--color-principal); font-weight: 800;">🎮 MUNDO JUGUETE</h1>
            <p style="font-size: 22px; margin: 20px 0; max-width: 600px; margin-left: auto; margin-right: auto;">La mejor tienda con los juguetes más modernos y divertidos.</p>
            <button onclick="showPage('products')" style="padding: 20px 50px; font-size: 22px; background: var(--color-acento); color: white; border: none; border-radius: 15px; font-weight: bold; margin-top: 30px;">VER CATÁLOGO ➡️</button>
        </div>
    </div>

    <!-- PÁGINA DE LISTADO -->
    <div id="product-list-page" class="page">
        <h1 style="text-align:center; color: var(--color-principal); margin: 10px 0 20px;">Nuestros Productos 🎁</h1>
        <div class="categories-nav" style="text-align: center; margin-bottom: 20px;">
            <button class="active" onclick="filterProducts('all')">📦 Todos</button>
            <button onclick="filterProducts('accion')">⚔️ Acción</button>
            <button onclick="filterProducts('tecnologia')">🤖 Tecnología</button>
            <button onclick="filterProducts('juegos')">🎲 Juegos</button>
        </div>
        <div id="products-container">
            <!-- Se carga con JS -->
        </div>
    </div>

    <!-- PÁGINA DE DETALLES -->
    <div id="product-detail-page" class="page">
        <!-- 📍 ANCLA PARA QUE SUBE SIEMPRE ARRIBA -->
        <div id="top-point"></div> 
        
        <div class="detail-header">
            <button class="back-button" onclick="showPage('products')">← Volver</button>
            <h2 id="detail-title">Detalles del Producto</h2>
        </div>

        <div id="detail-slider-track">
            <!-- Imágenes aquí -->
        </div>
        
        <div id="detail-thumbnails-container">
            <!-- Miniaturas aquí -->
        </div>

        <h3 id="detail-name"></h3>
        <p id="detail-price"></p>

        <!-- 🎬 CONTENEDOR DE VIDEO -->
        <div id="detail-video-container"></div>

        <p id="detail-description"></p>
    </div>

    <script>
        // --- 📦 PRODUCTOS DE EJEMPLO (Juguetería) ---
        const products = [
            { 
                id: 1, 
                name: "Robot Inteligente X200", 
                price: 89.99, 
                category: "tecnologia",
                description: "¡El robot más divertido y educativo! Camina, habla y responde a tus comandos. Hecho de materiales seguros y resistentes. Ideal para estimular la imaginación y el aprendizaje.", 
                images: [
                    "https://images.unsplash.com/photo-1608248597173-81ebf0ba7369?w=500",
                    "https://images.unsplash.com/photo-1563298724-dab192b0693b?w=500"
                ],
                video: "https://player.vimeo.com/video/76979871"
            },
            { 
                id: 2, 
                name: "Set de Construcción Mega", 
                price: 45.50,
                category: "juegos", 
                description: "Más de 500 piezas para crear estructuras increíbles. Fomenta la creatividad y la motricidad fina. Compatible con otras marcas líderes.", 
                images: ["https://images.unsplash.com/photo-1587654780291-39c9404d746b?w=500"]
            },
            { 
                id: 3, 
                name: "Muñeco Héroe Defensor", 
                price: 29.90,
                category: "accion", 
                description: "Tu héroe favorito con accesorios y puntos de articulación para todas las poses. ¡La aventura nunca termina!", 
                images: ["https://images.unsplash.com/photo-1611269154421-4e27233ac5c7?w=500"]
            }
        ];

        let currentProductId = null;
        let currentDetailSlide = 0;

        // ==============================================
        // 🚀 FUNCIÓN IR ARRIBA (SOLUCIÓN DEFINITIVA)
        // ==============================================
        function irArriba() {
            document.getElementById('top-point').scrollIntoView({ 
                behavior: 'auto', 
                block: 'start' 
            });
            setTimeout(() => {
                window.scrollTo(0, 0);
                document.body.scrollTop = 0;
                document.documentElement.scrollTop = 0;
            }, 10);
        }

        // ==============================================
        // 📄 FUNCIÓN MOSTRAR PÁGINA
        // ==============================================
        function showPage(page) {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('product-list-page').style.display = 'none';
            document.getElementById('product-detail-page').style.display = 'none';

            if(page === 'home') document.getElementById('home-page').style.display = 'block';
            else if(page === 'products') document.getElementById('product-list-page').style.display = 'block';
            else if(page === 'detail') document.getElementById('product-detail-page').style.display = 'block';

            irArriba();
        }

        // ==============================================
        // 👁️ FUNCIÓN VER DETALLES
        // ==============================================
        function viewDetails(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            currentProductId = id;
            currentDetailSlide = 0;

            // Cargar datos
            document.getElementById('detail-title').textContent = product.name;
            document.getElementById('detail-name').textContent = product.name;
            document.getElementById('detail-price').textContent = '$' + product.price.toFixed(2);
            document.getElementById('detail-description').textContent = product.description;

            // Crear Slides
            const track = document.getElementById('detail-slider-track');
            track.innerHTML = "";
            product.images.forEach(img => {
                const slide = document.createElement('div');
                slide.className = 'detail-slide';
                slide.innerHTML = `<img src="${img}" alt="${product.name}">`;
                track.appendChild(slide);
            });

            updateDetailSlidePosition();

            // Miniaturas
            const thumbsContainer = document.getElementById('detail-thumbnails-container');
            thumbsContainer.innerHTML = "";
            product.images.forEach((img, index) => {
                const imgEl = document.createElement('img');
                imgEl.src = img;
                imgEl.onclick = function() {
                    currentDetailSlide = index;
                    updateDetailSlidePosition();
                }
                if(index === 0) imgEl.classList.add('active-thumbnail');
                thumbsContainer.appendChild(imgEl);
            });

            // 🎬 CARGAR VIDEO VIMEO
            const videoContainer = document.getElementById('detail-video-container');
            if(product.video) {
                let videoUrl = product.video;
                if(videoUrl.includes('vimeo.com/') && !videoUrl.includes('player.vimeo.com')) {
                    const idVideo = videoUrl.split('/').pop();
                    videoUrl = `https://player.vimeo.com/video/${idVideo}?hd=1&quality=1080p`;
                }
                videoContainer.innerHTML = `<iframe src="${videoUrl}" allowfullscreen></iframe>`;
            } else {
                videoContainer.innerHTML = "";
            }

            showPage('detail');
        }

       



                           // ==============================================
        // 🎞️ FUNCIÓN CARRUSEL
        // ==============================================
        function updateDetailSlidePosition() {
            const track = document.getElementById('detail-slider-track');
            if(track) {
                track.style.transform = `translateX(-${currentDetailSlide * 100}%)`;
            }
            
            // Actualizar miniatura activa
            document.querySelectorAll('#detail-thumbnails-container img').forEach((img, i) => {
                img.classList.toggle('active-thumbnail', i === currentDetailSlide);
            });
        }

        // ==============================================
        // 🗂️ FUNCIÓN FILTRAR PRODUCTOS
        // ==============================================
        function filterProducts(category) {
            // Cambiar estilo de botones
            const buttons = document.querySelectorAll('.categories-nav button');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Filtrar tarjetas
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                if(category === 'all' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // ==============================================
        // 🚀 CARGAR PRODUCTOS AL INICIAR
        // ==============================================
        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = "";
            products.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.dataset.category = prod.category;
                card.innerHTML = `
                    <img src="${prod.images[0]}" alt="${prod.name}" style="width:100%; height:220px; object-fit:cover; border-radius:12px;">
                    <h3 style="margin: 15px 0 10px; font-size: 18px;">${prod.name}</h3>
                    <p style="color: #10B981; font-weight:bold; font-size:20px;">$${prod.price.toFixed(2)}</p>
                    <button class="details-button" onclick="viewDetails(${prod.id})">👁️ Ver Detalles</button>
                `;
                container.appendChild(card);
            });
        }

        // INICIO
        window.onload = function() {
            renderProducts();
        }

    </script>

</body>
</html>
